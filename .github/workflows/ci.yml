name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-test:
    name: PHP ${{ matrix.php }} / Drupal ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporary: remove when Drupal 10 reaches end of life. PHPUnit 9 has no
          # attribute classes, so this job analyzes source and leaves out tests.
          - {php: "8.3", core: "~10.6.0", drush: "drush/drush:^13", adapter: "drupal/tool:1.0.0-beta12", phpstan_paths: "web/modules/contrib/project_context_connector/src web/modules/contrib/project_context_connector/modules/project_context_connector_tool/src"}
          - {php: "8.4", core: "~11.4.0", drush: "drush/drush:^13", adapter: "drupal/tool:1.0.0-beta12 drupal/mcp_server:2.0.0-beta7 drupal/mcp_server_tool_bridge:1.0.0-beta5"}
          - {php: "8.5", core: "11.5.0-beta1", drush: "drush/drush:^13", adapter: "drupal/tool:1.0.0-beta12 drupal/mcp_server:2.0.0-beta7 drupal/mcp_server_tool_bridge:1.0.0-beta5"}
          - {php: "8.5", core: "12.0.0-beta2", drush: "drush/drush:14.x-dev", adapter: ""}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, xml, dom, curl, json, tokenizer, pdo, sqlite3, pdo_sqlite, zip, gd

      - name: Validate composer.json
        run: composer validate --no-check-lock --no-check-publish

      - name: Build a test site
        run: scripts/setup-test-env.sh "$RUNNER_TEMP/site" "${{ matrix.core }}" "${{ matrix.drush }}" ${{ matrix.adapter }}

      - name: Composer audit
        run: composer audit --working-dir="$RUNNER_TEMP/site" --no-dev

      - name: PHP CodeSniffer
        working-directory: ${{ runner.temp }}/site
        run: vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,yml web/modules/contrib/project_context_connector/ --ignore='*/.Records/*'

      - name: PHPStan level 5
        working-directory: ${{ runner.temp }}/site
        run: vendor/bin/phpstan analyse --no-progress -c "web/modules/contrib/project_context_connector/${{ matrix.adapter && 'phpstan-adapter.neon' || 'phpstan.neon' }}" ${{ matrix.phpstan_paths }}

      - name: PHPUnit (unit, kernel, functional)
        run: scripts/run-tests.sh "$RUNNER_TEMP/site"
