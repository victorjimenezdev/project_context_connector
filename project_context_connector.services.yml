services:
  logger.channel.project_context_connector:
    parent: logger.channel_base
    arguments: ["project_context_connector"]

  project_context_connector.composer_package_resolver:
    class: Drupal\project_context_connector\Service\ComposerPackageResolver
    arguments:
      - "%app.root%"
      - "@logger.channel.project_context_connector"

  project_context_connector.update_status_collector:
    class: Drupal\project_context_connector\Update\UpdateStatusCollector
    arguments:
      - "@module_handler"
      - "@keyvalue.expirable"
      - "@state"
      - "@config.factory"
      - "@datetime.time"
      - "@logger.channel.project_context_connector"
      - "@?update.manager"

  project_context_connector.context_snapshotter:
    class: Drupal\project_context_connector\Service\ContextSnapshotter
    arguments:
      - "@module_handler"
      - "@extension.list.module"
      - "@extension.list.theme"
      - "@config.factory"
      - "@state"
      - "@database"
      - "@datetime.time"
      - "@project_context_connector.composer_package_resolver"
      - "@project_context_connector.update_status_collector"
      - "@logger.channel.project_context_connector"

  project_context_connector.origin_validator:
    class: Drupal\project_context_connector\Service\OriginValidator
    arguments:
      - "@config.factory"

  project_context_connector.rate_limiter:
    class: Drupal\project_context_connector\Service\RateLimiter
    arguments:
      - "@flood"
      - "@config.factory"

  project_context_connector.failed_auth_enhancer:
    class: Drupal\project_context_connector\Routing\FailedAuthEnhancer
    arguments:
      - "@project_context_connector.rate_limiter"
      - "@request_stack"
    tags:
      - { name: route_enhancer }

  project_context_connector.signature_validator:
    class: Drupal\project_context_connector\Service\SignatureValidator
    arguments:
      - "@settings"
      - "@datetime.time"

  project_context_connector.signature_access_checker:
    class: Drupal\project_context_connector\Access\SignatureAccessChecker
    arguments:
      - "@project_context_connector.signature_validator"
    tags:
      - { name: access_check, applies_to: _pcc_signature }

  project_context_connector.cors_subscriber:
    class: Drupal\project_context_connector\EventSubscriber\CorsSubscriber
    arguments:
      - "@project_context_connector.origin_validator"
      - "@config.factory"
    tags:
      - { name: event_subscriber }

  project_context_connector.throttle_subscriber:
    class: Drupal\project_context_connector\EventSubscriber\ThrottleSubscriber
    arguments:
      - "@project_context_connector.rate_limiter"
      - "@current_user"
    tags:
      - { name: event_subscriber }

  project_context_connector.config_import_subscriber:
    class: Drupal\project_context_connector\EventSubscriber\ConfigImportSubscriber
    arguments:
      - "@config.typed"
    tags:
      - { name: event_subscriber }

  project_context_connector.cache_request_policy:
    class: Drupal\project_context_connector\PageCache\DenySnapshotRequests
    public: false
    tags:
      - { name: page_cache_request_policy }
      - { name: dynamic_page_cache_request_policy }
